name: Build Mod
on:
  push:
    branches: [ 26.3 ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with Gradle
        run: cd ghost-kill-tracker && gradle build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ghost-kill-tracker-jar
          path: ghost-kill-tracker/build/libs/*[^sources].jar
